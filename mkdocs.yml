site_name: PI1 · Grupo 01 (Hilmer) — 2026/2
site_description: Documentação do projeto de Projeto Integrador 1 (PI1) — Grupo 01, professor Hilmer.
site_url: https://fcte-pi1.github.io/2026_2_PI1_Grupo01_Hilmer/
site_author: Grupo 01 - Hilmer

repo_name: fcte-pi1/2026_2_PI1_Grupo01_Hilmer
repo_url: https://github.com/fcte-pi1/2026_2_PI1_Grupo01_Hilmer
edit_uri: edit/main/docs/

docs_dir: docs

# README interno da pasta de figuras não vai para a navegação.
not_in_nav: |
  /figs/README.md
  /scripts/README.md

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para o modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: pt

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - scripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Início: README.md
  - Status das equipes:
      - status-equipes/README.md
      - Software: status-equipes/software.md
      - Eletrônica: status-equipes/eletronica.md
      - Energia: status-equipes/energia.md
      - Estrutura: status-equipes/estrutura.md
  - 1. TAP: 01-tap.md
  - 2. Requisitos: 02-requisitos.md
  - 3. EAP: 03-eap.md
  - 4. Projeto conceitual:
      - 04-projeto-conceitual/README.md
      - 4.1 Estruturas: 04-projeto-conceitual/estruturas.md
      - 4.1.1 Labirinto de testes: 04-projeto-conceitual/labirinto-testes.md
      - 4.2 Energia: 04-projeto-conceitual/energia.md
      - 4.2.1 Proteções de entrada: 04-projeto-conceitual/energia/protecoes-entrada.md
      - 4.2.2 Reguladores Step-Down (Buck): 04-projeto-conceitual/energia/reguladores-buck.md
      - 4.2.3 Curva de Descarga e SoC LiPo: 04-projeto-conceitual/energia/curva-descarga-lipo.md
      - 4.2.4 Monitoramento de Tensão (ADC): 04-projeto-conceitual/energia/monitoramento-tensao.md
      - 4.2.5 Ensaios de subtensão e PPTC: 04-projeto-conceitual/energia/ensaios-protecoes.md
      - 4.2.6 POP de recarga balanceada: 04-projeto-conceitual/energia/pop-recarga-bateria.md
      - 4.2.7 Dimensionamento de divisor resistivo: 04-projeto-conceitual/energia/dimensiona-divisor-resistivo.md
      - 4.3 Hardware: 04-projeto-conceitual/hardware.md
      - 4.3.1 Diagramas de hardware: 04-projeto-conceitual/hardware-diagramas.md
      - 4.3.2 Justificativa dos componentes: 04-projeto-conceitual/justificativa-componentes.md
      - 4.4 Software: 04-projeto-conceitual/software.md
      - "4.4.1 Firmware: implementação": 04-projeto-conceitual/firmware.md
  - 5. Cronograma: 05-cronograma.md
  - 6. Orçamento: 06-orcamento.md
  - 7. Testes:
      - 07-testes/README.md
      - 7.1 Estrutura: 07-testes/estrutura.md
      - 7.2 Energia: 07-testes/energia.md
      - 7.2.1 Ensaio de Bancada de Baterias: 07-testes/energia/teste-componentes/bateria/teste-bancada-bateria.md
      - 7.3 Hardware: 07-testes/hardware.md
      - 7.3.1 Calibração do VL53L0X: 07-testes/hardware/calibracao-vl53l0x.md
      - 7.4 Software: 07-testes/software.md
      - 7.5 Integração: 07-testes/integracao.md
  - 8. Avaliação de desempenho: 08-avaliacao-de-desempenho.md
  - 9. Relatório de encerramento: 09-relatorio-de-encerramento.md
