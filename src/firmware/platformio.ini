[platformio]
default_envs = esp32c3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@7.4.2

# Placa ESP32-C3 Super Mini (esquemático Rev 2.0). A plataforma não tem definição própria dela; o
# chip e a flash (ESP32-C3, 4 MB) são os mesmos da esp32-c3-devkitm-1.
# O `Serial` precisa sair pela USB nativa (GPIO18/19), porque GPIO20/21, a UART0, são as entradas
# IN3/IN4 do driver dos motores (`Pinos.h`). Sem estas duas opções, o log iria para a UART0.
[env:esp32c3]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
# Biblioteca dos VL53L0X só na placa: no `native`, a regra de validade fica no `CombinadorTof`.
lib_deps =
  ${env.lib_deps}
  pololu/VL53L0X@1.3.1
# `src/bancada/` guarda programas de bancada, cada um com o próprio `setup()`; ficam fora do robô.
build_src_filter = +<*> -<bancada/>
monitor_speed = 115200

# Firmware de bancada dos 3 VL53L0X (#344, #175): menu pela serial, motores sempre freados.
# Uso guiado: `scripts/bancada_tof.py`. Gravação manual: `pio run -e bancada_tof -t upload`.
[env:bancada_tof]
extends = env:esp32c3
build_src_filter = +<bancada/bancada_tof.cpp>
lib_ldf_mode = deep+

# Firmware de bancada geral: menu de uma tecla pela serial para conferir os 3 VL53L0X, o MPU6050 e
# os motores no robô montado. Uso: `pio run -e bancada_geral -t upload && pio device monitor -e bancada_geral`.
[env:bancada_geral]
extends = env:esp32c3
build_src_filter = +<bancada/bancada_geral.cpp>
lib_ldf_mode = deep+

# Firmware de bancada do deslocamento sem encoder (#380): aciona os motores e manda o log da
# estimativa pela serial. Uso guiado: `scripts/bancada_deslocamento.py`.
[env:bancada_deslocamento]
extends = env:esp32c3
build_src_filter = +<bancada/bancada_deslocamento.cpp>
lib_ldf_mode = deep+

[env:native]
platform = native
lib_ignore = drivers_esp32
lib_ldf_mode = deep+
test_framework = unity

[env:native_cobertura]
extends = env:native
build_flags =
  ${env.build_flags}
  -O0
  --coverage
extra_scripts = post:cobertura_link.py
