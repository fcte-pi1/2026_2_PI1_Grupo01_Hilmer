[platformio]
default_envs = esp32_devkit

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@7.4.2

# Placa do robô: ESP32 DevKit V1 (ESP32 clássico, 4 MB de flash), com a pinagem da tabela de fiação da
# bancada integrada (`Pinos.h`). O `Serial` sai pela UART0 (GPIO1/GPIO3), pelo conversor USB da placa.
[env:esp32_devkit]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
# Biblioteca dos VL53L0X só na placa: no `native`, a regra de validade fica no `CombinadorTof`.
lib_deps =
  ${env.lib_deps}
  pololu/VL53L0X@1.3.1
# `src/bancada/` guarda programas de bancada, cada um com o próprio `setup()`; ficam fora do robô.
build_src_filter = +<*> -<bancada/>
monitor_speed = 115200

# Firmware de bancada dos 3 VL53L0X (#344, #175): menu pela serial, motores sempre freados.
# Uso guiado: `scripts/bancada_tof.py`. Gravação manual: `pio run -e bancada_tof_devkit -t upload`.
[env:bancada_tof_devkit]
extends = env:esp32_devkit
build_src_filter = +<bancada/bancada_tof.cpp>
lib_ldf_mode = deep+

# Bancada geral: menu de uma tecla pela serial para conferir os 3 VL53L0X, o MPU6050, os motores, os
# encoders, o botão de largada, a bateria e a telemetria (Wi-Fi e Supabase; a rede também pode ser
# escolhida pela serial, tecla `p`). Uso: `pio run -e bancada_geral_devkit -t upload`.
[env:bancada_geral_devkit]
extends = env:esp32_devkit
build_flags =
  ${env.build_flags}
  -DBANCADA_COM_TELEMETRIA
build_src_filter = +<bancada/bancada_geral.cpp>
lib_ldf_mode = deep+

# Mesma bancada geral, gravada pelo Wi-Fi (OTA), sem cabo. Antes, grave uma vez por cabo
# (`bancada_geral_devkit`) e deixe a placa conectada na rede; ela aparece como `micromouse-bancada.local`.
# Uso: `pio run -e bancada_geral_devkit_ota -t upload --upload-port <IP ou micromouse-bancada.local>`.
# O computador precisa estar na mesma rede (alguns hotspots isolam os aparelhos entre si).
[env:bancada_geral_devkit_ota]
extends = env:bancada_geral_devkit
upload_protocol = espota
upload_port = micromouse-bancada.local
upload_flags =
  --auth=micromouse

# Firmware de bancada do deslocamento sem encoder (#380): aciona os motores e manda o log da
# estimativa pela serial. Uso guiado: `scripts/bancada_deslocamento.py`.
[env:bancada_deslocamento_devkit]
extends = env:esp32_devkit
build_src_filter = +<bancada/bancada_deslocamento.cpp>
lib_ldf_mode = deep+

[env:native]
platform = native
lib_ignore = drivers_esp32
lib_ldf_mode = deep+
test_framework = unity

[env:native_cobertura]
extends = env:native
build_flags =
  ${env.build_flags}
  -O0
  --coverage
extra_scripts = post:cobertura_link.py
