; Firmware do teste de integração dos sensores I²C (26/10/2026): 3 VL53L0X e MPU6050 no protótipo em protoboard.
; Mesma plataforma do firmware do projeto (espressif32@7.1.3, Arduino-ESP32 2.x).
[env:esp32-c3-devkitm-1]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    electroniccats/MPU6050@^1.4.5
    pololu/VL53L0X@^1.3.1
