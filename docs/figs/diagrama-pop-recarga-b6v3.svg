<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="auto" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .charger { fill: #1e3a8a; stroke: #172554; stroke-width: 2.5; }
      .lcd { fill: #a3e635; stroke: #3f6212; stroke-width: 2; }
      .lcd-txt { fill: #1a2e05; font-family: Consolas, monospace; font-size: 12.5px; font-weight: bold; }
      .btn { fill: #cbd5e1; stroke: #475569; stroke-width: 1.5; }
      .safebag { fill: #f8fafc; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6,4; }
      .lipo { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .xt30 { fill: #eab308; stroke: #a16207; stroke-width: 1.8; }
      .jst { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.8; }
      .wire-pos { stroke: #dc2626; stroke-width: 3.5; fill: none; stroke-linecap: round; }
      .wire-neg { stroke: #1f2937; stroke-width: 3.5; fill: none; stroke-linecap: round; }
      .wire-bal { stroke: #2563eb; stroke-width: 2.2; fill: none; stroke-dasharray: 4,2; }
      .title { fill: #1f2328; font-size: 14px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 11px; font-weight: bold; }
      .step-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.4; }
      .step-title { fill: #1d4ed8; font-size: 11.5px; font-weight: bold; }
      .step-txt { fill: #334155; font-size: 10.5px; }
      .warn-box { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.4; }
      .warn-txt { fill: #991b1b; font-size: 11px; font-weight: bold; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="4" y="4" width="912" height="412" rx="8" class="bg"/>
  <text x="460" y="28" text-anchor="middle" class="title" font-size="15">ESQUEMA OPERACIONAL DE CONEXÃO DUPLA — RECARGA BALANCEADA LIPO 2S (ISSUE #210)</text>

  <!-- ==================== DC POWER SUPPLY (LEFT) ==================== -->
  <rect x="28" y="110" width="135" height="145" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="95" y="135" text-anchor="middle" class="title" font-size="12.5">FONTE DC BANCADA</text>
  <text x="95" y="153" text-anchor="middle" class="step-txt">11,0 V a 18,0 V DC</text>
  <text x="95" y="169" text-anchor="middle" class="step-txt">(Cap. ≥ 1,0 A / 15 W)</text>
  <rect x="44" y="185" width="102" height="52" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="95" y="203" text-anchor="middle" class="step-title">PASSO 1</text>
  <text x="95" y="218" text-anchor="middle" class="step-txt">Energizar fonte</text>
  <text x="95" y="231" text-anchor="middle" class="step-txt">antes da bateria</text>

  <!-- DC Jack Cable -->
  <line x1="163" y1="165" x2="215" y2="165" class="wire-pos"/>
  <line x1="163" y1="180" x2="215" y2="180" class="wire-neg"/>

  <!-- ==================== B6 V3 SMART CHARGER (CENTER) ==================== -->
  <rect x="215" y="85" width="275" height="215" rx="10" class="charger"/>
  <text x="352" y="110" text-anchor="middle" class="label" font-size="13.5">CARREGADOR B6 V3 SMART (80W)</text>

  <!-- LCD Screen -->
  <rect x="240" y="122" width="225" height="64" rx="4" class="lcd"/>
  <text x="252" y="144" class="lcd-txt">LiPo BALANCE      0.6A</text>
  <text x="252" y="164" class="lcd-txt">7.4V (2S)     08.40V</text>
  <text x="252" y="180" class="lcd-txt" font-size="10.5">C1: 4.20V | C2: 4.20V [OK]</text>

  <!-- Control Buttons -->
  <circle cx="265" cy="218" r="13" class="btn"/>
  <text x="265" y="244" text-anchor="middle" class="label" font-size="9.5">BATT/STOP</text>
  <circle cx="322" cy="218" r="13" class="btn"/>
  <text x="322" y="244" text-anchor="middle" class="label" font-size="9.5">DEC (-)</text>
  <circle cx="378" cy="218" r="13" class="btn"/>
  <text x="378" y="244" text-anchor="middle" class="label" font-size="9.5">INC (+)</text>
  <circle cx="435" cy="218" r="13" class="btn"/>
  <text x="435" y="244" text-anchor="middle" class="label" font-size="9.5">START/ENT</text>

  <!-- Output Banana Sockets (Top Right of Charger) -->
  <circle cx="476" cy="125" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <text x="458" y="114" text-anchor="end" class="label" font-size="10">OUT (+)</text>
  <circle cx="476" cy="155" r="8" fill="#111827" stroke="#ffffff" stroke-width="1.5"/>
  <text x="458" y="160" text-anchor="end" class="label" font-size="10">OUT (-)</text>

  <!-- XH Balance Port 2S (Bottom Right of Charger) -->
  <rect x="468" y="225" width="18" height="38" rx="2" class="jst"/>
  <circle cx="477" cy="234" r="2.2" fill="#111827"/>
  <circle cx="477" cy="244" r="2.2" fill="#2563eb"/>
  <circle cx="477" cy="254" r="2.2" fill="#dc2626"/>
  <text x="462" y="275" text-anchor="end" class="label" font-size="10">PORTA 2S (XH)</text>

  <!-- ==================== CABLES & CONNECTORS ==================== -->
  <!-- Step 2 Callout -->
  <rect x="508" y="48" width="158" height="50" rx="4" class="step-box"/>
  <text x="587" y="64" text-anchor="middle" class="step-title">PASSO 2 e 3: Potência</text>
  <text x="587" y="78" text-anchor="middle" class="step-txt">2º Bananas no carregador</text>
  <text x="587" y="91" text-anchor="middle" class="step-txt">3º Acoplar plugue XT-30</text>

  <!-- Main Charge Wires to XT-30 -->
  <path d="M 484 125 L 575 125 L 575 142" class="wire-pos"/>
  <path d="M 484 155 L 575 155 L 575 152" class="wire-neg"/>

  <!-- XT-30 Connector Pair -->
  <rect x="565" y="133" width="44" height="28" rx="3" class="xt30"/>
  <text x="587" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#422006">XT-30</text>

  <!-- Wires from XT-30 to Battery -->
  <line x1="609" y1="141" x2="685" y2="141" class="wire-pos"/>
  <line x1="609" y1="153" x2="685" y2="153" class="wire-neg"/>

  <!-- Balance Wires from Port 2S to JST-XHR-3P -->
  <line x1="486" y1="234" x2="685" y2="234" class="wire-neg" stroke-width="2"/>
  <line x1="486" y1="244" x2="685" y2="244" class="wire-bal"/>
  <line x1="486" y1="254" x2="685" y2="254" class="wire-pos" stroke-width="2"/>
  <rect x="562" y="226" width="52" height="36" rx="3" class="jst"/>
  <text x="588" y="248" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e293b">XHR-3P</text>

  <!-- Step 4 Callout -->
  <rect x="508" y="275" width="158" height="42" rx="4" class="step-box"/>
  <text x="587" y="291" text-anchor="middle" class="step-title">PASSO 4: Balanceamento</text>
  <text x="587" y="306" text-anchor="middle" class="step-txt">Conectar JST-XHR-3P (2S)</text>

  <!-- ==================== LIPO SAFE BAG & BATTERY (RIGHT) ==================== -->
  <rect x="672" y="75" width="220" height="245" rx="8" class="safebag"/>
  <text x="782" y="96" text-anchor="middle" class="warn-txt">BOLSA ANTICHAMA (LiPo Safe Bag)</text>

  <!-- Battery Body -->
  <rect x="685" y="115" width="192" height="158" rx="6" class="lipo"/>
  <text x="781" y="142" text-anchor="middle" class="label" font-size="13" fill="#38bdf8">TATTU LiPo 2S1P</text>
  <text x="781" y="162" text-anchor="middle" class="label" font-size="12">650 mAh | 75C | 7,4 V</text>
  <text x="781" y="184" text-anchor="middle" class="label" font-size="10.5" fill="#fde047">Carga 1C = 0,6 A (Máx 0,65 A)</text>
  <text x="781" y="204" text-anchor="middle" class="label" font-size="10.5" fill="#86efac">Fim de Carga: 8,40 V (4,20 V/cél)</text>
  <text x="781" y="224" text-anchor="middle" class="label" font-size="10.5" fill="#cbd5e1">Storage: 7,60 V (3,80 V/cél)</text>
  <text x="781" y="252" text-anchor="middle" class="label" font-size="10.5" fill="#fca5a5">Temp. Máx: 45 °C (Tocar a cada 15m)</text>

  <!-- ==================== SAFETY FOOTER BANNER ==================== -->
  <rect x="28" y="335" width="864" height="62" rx="6" class="warn-box"/>
  <text x="460" y="355" text-anchor="middle" class="warn-txt" font-size="12">REGRAS CRÍTICAS DE SEGURANÇA E CONTINGÊNCIA HOMOLOGADAS PELA EQUIPE</text>
  <text x="460" y="373" text-anchor="middle" class="step-txt">1. NUNCA una os pinos banana soltos com o XT-30 conectado na bateria (curto-circuito direto de 48 A+). Desconecte sempre na ordem inversa (4º → 3º → 2º → 1º).</text>
  <text x="460" y="389" text-anchor="middle" class="step-txt">2. Se a temperatura atingir &gt; 45 °C, houver estufamento (puffing) ou desbalanceamento &gt; 0,10 V: pressione STOP imediatamente e isole o pack.</text>
</svg>
