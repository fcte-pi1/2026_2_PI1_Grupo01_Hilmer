<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="auto" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #840000; stroke-width: 2; }
      .wire { stroke: #008400; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .comp { stroke: #840000; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .comp-fill { fill: #840000; stroke: #840000; stroke-width: 1.5; }
      .pin { stroke: #840000; stroke-width: 2; }
      .junction { fill: #008400; }
      .ref { fill: #006464; font-size: 13px; font-weight: bold; }
      .val { fill: #840000; font-size: 12px; font-weight: bold; }
      .fp { fill: #555555; font-size: 10.5px; font-style: italic; }
      .net { fill: #000084; font-size: 12.5px; font-weight: bold; }
      .note { fill: #333333; font-size: 11px; }
      .box-mod { stroke: #006464; stroke-width: 1.5; stroke-dasharray: 6,4; fill: #f9fbfd; }
      .title-txt { fill: #840000; font-size: 13px; font-weight: bold; }
    </style>
  </defs>

  <!-- Sheet Border (KiCad Style) -->
  <rect x="6" y="6" width="908" height="448" class="bg"/>
  <rect x="14" y="14" width="892" height="432" fill="none" stroke="#840000" stroke-width="1"/>

  <!-- Modular Boundary Box -->
  <rect x="195" y="45" width="530" height="335" rx="6" class="box-mod"/>
  <text x="210" y="65" class="ref" font-size="13.5">SUBCIRCUITO MODULAR: MALHA DE PROTEÇÃO DE ENTRADA (ISSUE #200)</text>

  <!-- ==================== BATTERY & XT-30 (BT1 / J1) ==================== -->
  <!-- Connector XT-30 -->
  <rect x="75" y="120" width="46" height="90" fill="#fffbe6" stroke="#840000" stroke-width="2"/>
  <text x="82" y="112" class="ref">BT1 / J1</text>
  <text x="32" y="230" class="val">Tattu LiPo 2S 650mAh</text>
  <text x="32" y="245" class="val">7.4V Nom / 8.4V Max (75C)</text>
  <text x="32" y="260" class="fp">Footprint: AMASS_XT30U-M</text>
  <text x="85" y="150" class="val" font-size="13">1 (+)</text>
  <text x="85" y="190" class="val" font-size="13">2 (-)</text>

  <!-- Wire from XT-30 Pin 1 to PPTC -->
  <line x1="121" y1="145" x2="250" y2="145" class="wire"/>
  <text x="135" y="138" class="net">VBAT_RAW</text>
  <text x="135" y="160" class="note">(6,6 V a 8,4 V)</text>

  <!-- ==================== F1: PPTC RESETTABLE FUSE ==================== -->
  <g transform="translate(250, 145)">
    <rect x="0" y="-12" width="76" height="24" fill="#fff5f5" class="comp"/>
    <line x1="-8" y1="18" x2="84" y2="-18" class="comp"/>
    <line x1="84" y1="-18" x2="96" y2="-18" class="comp"/>
    <text x="18" y="-22" class="ref">F1 (PPTC)</text>
    <text x="-5" y="34" class="val">Bourns MF-R185</text>
    <text x="-15" y="48" class="note">I_hold = 1,85 A | I_trip = 3,70 A</text>
    <text x="-15" y="62" class="note">V_max = 30 V | R_typ = 45 mΩ</text>
    <text x="-15" y="76" class="fp">FP: Fuse_Bourns_MF-R185 / 1812</text>
    <text x="-14" y="-4" class="note">1</text>
    <text x="82" y="-4" class="note">2</text>
  </g>

  <!-- Wire from PPTC to P-MOSFET Drain -->
  <line x1="326" y1="145" x2="490" y2="145" class="wire"/>
  <text x="365" y="138" class="net">VBAT_FUSED</text>

  <!-- ==================== Q1: HIGH-SIDE P-MOSFET (AO3407A) ==================== -->
  <!-- Note: In reverse-polarity protection, Drain (3) is on Input side, Source (2) is on Output side! -->
  <g transform="translate(490, 145)">
    <!-- MOSFET Enclosure Circle -->
    <circle cx="45" cy="18" r="38" fill="#fff9f9" stroke="#840000" stroke-width="1.8"/>
    <!-- Drain connection (Pin 3, Left) -->
    <line x1="0" y1="0" x2="26" y2="0" class="comp"/>
    <line x1="26" y1="0" x2="26" y2="24" class="comp"/>
    <!-- Source connection (Pin 2, Right) -->
    <line x1="90" y1="0" x2="64" y2="0" class="comp"/>
    <line x1="64" y1="0" x2="64" y2="24" class="comp"/>
    <!-- Channel segments -->
    <line x1="20" y1="24" x2="32" y2="24" class="comp" stroke-width="3"/>
    <line x1="39" y1="24" x2="51" y2="24" class="comp" stroke-width="3"/>
    <line x1="58" y1="24" x2="70" y2="24" class="comp" stroke-width="3"/>
    <!-- Substrate to Source -->
    <line x1="45" y1="24" x2="45" y2="0" class="comp"/>
    <line x1="45" y1="0" x2="64" y2="0" class="comp"/>
    <!-- P-Channel Arrow (pointing OUT from channel towards substrate/gate, or UP on middle terminal) -->
    <polygon points="45,22 41,12 49,12" class="comp-fill"/>
    <!-- Gate plate and Pin 1 (Bottom) -->
    <line x1="22" y1="32" x2="68" y2="32" class="comp"/>
    <line x1="45" y1="32" x2="45" y2="75" class="comp"/>

    <!-- Intrinsic Body Diode (Anode at Drain/Left, Cathode at Source/Right) -->
    <line x1="26" y1="-12" x2="64" y2="-12" class="comp"/>
    <polygon points="50,-12 38,-18 38,-6" class="comp-fill"/>
    <line x1="50" y1="-19" x2="50" y2="-5" class="comp"/>
    <line x1="26" y1="0" x2="26" y2="-12" class="comp"/>
    <line x1="64" y1="0" x2="64" y2="-12" class="comp"/>

    <!-- Pin Numbers & Labels -->
    <text x="-8" y="-8" class="val">D (3)</text>
    <text x="72" y="-8" class="val">S (2)</text>
    <text x="50" y="68" class="val">G (1)</text>
    <text x="10" y="-32" class="ref">Q1 (P-MOSFET)</text>
    <text x="-5" y="-46" class="val">AO3407A / DMP2035U</text>
    <text x="-15" y="-60" class="fp">FP: SOT-23 (R_DS(on) = 28 mΩ)</text>
  </g>

  <!-- Wire from P-MOSFET Source to Output -->
  <line x1="580" y1="145" x2="775" y2="145" class="wire"/>
  <circle cx="645" cy="145" r="4" class="junction"/>
  <text x="662" y="138" class="net">+VBAT_PROT</text>
  <text x="662" y="160" class="note">(Queda &lt; 0,035 V @ 0,43 A)</text>

  <!-- ==================== GATE BIAS (R_G1) & ZENER CLAMP (D_Z1) ==================== -->
  <!-- Gate Node Wire -->
  <line x1="535" y1="220" x2="535" y2="265" class="wire"/>
  <circle cx="535" cy="240" r="4" class="junction"/>
  <line x1="535" y1="240" x2="645" y2="240" class="wire"/>
  <text x="455" y="244" class="net">GATE_BIAS</text>

  <!-- D_Z1: Zener Clamp between Gate and Source -->
  <line x1="645" y1="145" x2="645" y2="178" class="wire"/>
  <line x1="645" y1="212" x2="645" y2="240" class="wire"/>
  <g transform="translate(645, 195)">
    <!-- Cathode at top (Source), Anode at bottom (Gate) -->
    <polygon points="0,-12 -9,8 9,8" class="comp" fill="#fff5f5"/>
    <polyline points="-11,-7 -9,-12 9,-12 11,-17" class="comp"/>
    <text x="15" y="-4" class="ref">D_Z1</text>
    <text x="15" y="10" class="val">BZT52C12 (12 V)</text>
    <text x="15" y="24" class="fp">FP: SOD-123</text>
  </g>

  <!-- R_G1: Pull-down Resistor 100k from Gate to GND -->
  <g transform="translate(535, 265)">
    <rect x="-9" y="0" width="18" height="52" fill="#fff5f5" class="comp"/>
    <text x="-75" y="22" class="ref">R_G1</text>
    <text x="-75" y="36" class="val">100 kΩ</text>
    <text x="-95" y="50" class="fp">FP: R_0805</text>
  </g>
  <line x1="535" y1="317" x2="535" y2="350" class="wire"/>
  <circle cx="535" cy="350" r="4" class="junction"/>

  <!-- ==================== GND BUS & OUTPUT INTERFACE ==================== -->
  <!-- Wire from XT-30 Pin 2 (GND) to Output GND -->
  <line x1="121" y1="185" x2="155" y2="185" class="wire"/>
  <line x1="155" y1="185" x2="155" y2="350" class="wire"/>
  <line x1="155" y1="350" x2="775" y2="350" class="wire"/>
  <text x="365" y="343" class="net">GND (Referência Comum Estrela)</text>

  <!-- GND Symbol -->
  <g transform="translate(535, 350)">
    <line x1="0" y1="0" x2="0" y2="12" class="comp"/>
    <line x1="-14" y1="12" x2="14" y2="12" class="comp"/>
    <line x1="-9" y1="17" x2="9" y2="17" class="comp"/>
    <line x1="-4" y1="22" x2="4" y2="22" class="comp"/>
  </g>

  <!-- Output Integration Block (To Main Circuit) -->
  <rect x="775" y="115" width="118" height="265" fill="#eef7ee" stroke="#006400" stroke-width="2" rx="4"/>
  <text x="786" y="135" class="ref" fill="#004d00">INTEGRAÇÃO PCB</text>
  <text x="784" y="152" class="val" fill="#004d00">1: +VBAT_PROT</text>
  <text x="784" y="168" class="note">→ Chave SW1 (VBAT)</text>
  <text x="784" y="183" class="note">→ Buck +6V (MP1584 U4)</text>
  <text x="784" y="198" class="note">→ Buck +5V (MP1584 U2)</text>
  <text x="784" y="213" class="note">→ Buck +3V3 (MP1584 U5)</text>
  <text x="784" y="228" class="note">→ ADC (BAT_ADC_TEST)</text>
  <text x="784" y="354" class="val" fill="#004d00">2: GND_COMUM</text>

  <!-- Title Block (Bottom Right KiCad Style) -->
  <rect x="480" y="392" width="426" height="54" fill="#fffafa" stroke="#840000" stroke-width="1"/>
  <text x="492" y="410" class="title-txt">PROJETO: Micromouse PI1 — Grupo 01 (Prof. Dr. Hilmer Neri)</text>
  <text x="492" y="426" class="note">FOLHA: Proteções de Entrada (PPTC + P-MOSFET High-Side) — Issue #200</text>
  <text x="492" y="440" class="fp">Arquivo KiCad: hw/protecao_entrada.kicad_sch | Rev 2.0 | Out/2026</text>
</svg>
